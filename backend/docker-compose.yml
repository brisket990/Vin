services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vin
      POSTGRES_PASSWORD: vin
      POSTGRES_DB: vin
    ports:
      - '5432:5432'
    volumes:
      - vin_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vin']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://vin:vin@db:5432/vin
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      API_KEY_ENCRYPTION_SECRET: ${API_KEY_ENCRYPTION_SECRET:-change-me-too}
      STORAGE_DIR: /data/photos
    ports:
      - '3000:3000'
    volumes:
      - vin_photos:/data/photos

volumes:
  vin_db_data:
  vin_photos:
